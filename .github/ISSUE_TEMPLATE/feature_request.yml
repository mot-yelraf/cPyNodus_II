name: Feature request
description: Propose a focused cPyNodus_II capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Please discuss large changes before implementation. cPyNodus_II prioritizes constrained-memory reliability and compatibility with its verified CircuitPython targets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or device problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change and its expected behavior.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sensor support
        - Switch or relay support
        - NodusWeb or onboarding
        - MQTT or Sensorius contract
        - WeeWX integration
        - Home Assistant integration
        - OTA or recovery
        - Build, deployment, or tooling
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Hardware and compatibility considerations
      description: Identify affected boards, CircuitPython APIs, memory pressure, config keys, public MQTT topics, or migration concerns.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround or smaller approach did you consider?
    validations:
      required: false
