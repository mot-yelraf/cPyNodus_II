[Skin]
    skin = Nodus

[Units]
    unit_system = METRIC
    [[StringFormats]]
        degree_F = %.1f
        percent = %.0f
        inHg = %.3f
        kPa = %.3f
        vpd = %.3f
        absoluteHumidity = %.2f
        dewVpdRisk = %.0f
        dewpointDepression = %.1f

[Extras]
    site_title = Nodus Automatio Instrumentorum
    nodus_title = Nodus Automatio Instrumentorum
    nodus_tagline = Indoor environment + VPD + disease-risk indicators
    device_id = unknown
    firmware_version = unknown
    sensor_description = Sensor conditions

[Labels]
    inTemp = Inside Temp
    inHumidity = Inside Humidity
    pressure = Station Pressure
    vpd = VPD
    absoluteHumidity = Absolute Humidity
    dewpoint = Dew Point
    dewpointDepression = Dewpoint Depression
    dewVpdRisk = DewVPD Risk

[CheetahGenerator]
    encoding = html_entities
    search_list_extensions = user.nodus_identity.NodusIdentity, user.nodus_switch.NodusSwitchStatusSearchList, user.nodus_automation.NodusAutomationStatus, user.nodus_astronomy.NodusAstronomy

    [[Files]]
        [[[index.html]]]
            template = index.html.tmpl

[NodusIdentity]
    timeout = 2

[NodusAstronomy]
    ephemeris = /var/lib/weewx/skyfield/de421.bsp

[NodusAutomationStatus]
    status_file = /var/lib/weewx/nodus_automation.json

[NodusSwitchStatus]
    status_file = /var/lib/weewx/nodus_switch.json

[ImageGenerator]
    image_width = 360
    image_height = 190
    image_background_color = "#ffffff"
    chart_background_color = "#f7f9fa"
    chart_gridline_color = "#d9e4e8"
    chart_line_colors = "#2864dc"
    chart_line_width = 2
    axis_label_font_color = "#747b85"
    bottom_label_font_color = "#747b85"
    unit_label_font_color = "#747b85"
    anti_alias = 2
    skip_if_empty = true
    show_daynight = false

    [[micrographs]]
        time_length = 24h
        x_label_format = %H
        x_label_spacing = 2
        y_nticks = 4

        [[[micro_absoluteHumidity]]]
            [[[[absoluteHumidity]]]]

        [[[micro_dewpoint]]]
            [[[[dewpoint]]]]

        [[[micro_dewpointDepression]]]
            [[[[dewpointDepression]]]]

        [[[micro_dewVpdRisk]]]
            [[[[dewVpdRisk]]]]

        [[[micro_inHumidity]]]
            [[[[inHumidity]]]]

        [[[micro_inTemp]]]
            [[[[inTemp]]]]

        [[[micro_pressure]]]
            [[[[pressure]]]]

        [[[micro_vpd]]]
            [[[[vpd]]]]

[CopyGenerator]
    copy_once = style.css, dashboard.js

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.imagegenerator.ImageGenerator, weewx.reportengine.CopyGenerator
