<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nodus AI General Settings</title>
  <link rel="icon" href="nodus-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="system.css">
</head>
<body>
<main class="settings-dialog">
  <header class="dialog-header"><h1 id="system-heading">Nodus Automation Instrumentorum</h1><a class="circle-close" href="http://localhost/" title="Return to dashboard" aria-label="Return to dashboard">&times;</a></header>
  <div class="dialog-layout">
    <aside class="sidebar">
      <nav aria-label="Nodus system setup">
        <a href="#system-settings" data-view="system-settings">General Settings</a>
        <a id="automations-link" href="#automations">Automations</a>
        <a href="#install-device" data-view="install-device">Install Device</a>
        <a href="#remove-device" data-view="remove-device">Remove Device</a>
      </nav>
    </aside>
    <section class="workspace">
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="system-settings" class="view-card">
        <header><h2>General Settings <span id="nodus-ai-version" class="nodus-ai-version" aria-label="Nodus AI version"></span></h2></header>
        <form id="system-form">
          <div class="view-content system-groups">
            <details id="weewx-preferences" class="setup-group">
              <summary>WeeWX Preferences</summary>
              <div class="setup-group-body">
                <div class="form-grid editable">
                  <label>System title<input id="system-title" maxlength="80"></label>
                  <label>Online timeout (seconds)<input id="online-timeout" type="number" min="30" max="3600"></label>
                  <label>Automatic provisioning<select id="auto-provision"><option value="yes">Yes</option><option value="no">No</option></select></label>
                </div>
                <div class="setup-group-actions"><button class="primary" type="submit">Save</button></div>
              </div>
            </details>
            <details id="station-mqtt-info" class="setup-group">
              <summary>Station &amp; MQTT</summary>
              <div class="setup-group-body"><div id="station-info" class="info-grid"></div></div>
            </details>
            <details id="weewx-runtime-info" class="setup-group">
              <summary>WeeWX Runtime &amp; Files</summary>
              <div class="setup-group-body"><div id="weewx-info" class="info-grid runtime-grid"></div></div>
            </details>
          </div>
        </form>
      </section>
      <section id="install-device" class="view-card" hidden>
        <header><h2>Install Discovered Device</h2></header>
        <form id="install-form">
          <div class="view-content">
            <p class="device-note">Select one discovered device after automatic provisioning has been disabled.</p>
            <div id="install-device-list" class="device-list"></div>
          </div>
          <footer><button id="install-submit" class="primary" type="submit" disabled>Install Selected</button></footer>
        </form>
      </section>
      <section id="remove-device" class="view-card" hidden>
        <header><h2>Remove Device</h2></header>
        <form id="remove-form">
          <div id="device-list" class="device-list view-content"></div>
          <label class="confirm"><input id="remove-confirm" type="checkbox">I understand this deletes selected WeeWX settings and data and clears retained MQTT messages.</label>
          <footer><button id="remove-submit" class="danger" type="submit" disabled>Remove Selected</button></footer>
        </form>
      </section>
    </section>
  </div>
</main>
<script src="nodus-ai-version.js"></script>
<script src="system.js"></script>
</body>
</html>
